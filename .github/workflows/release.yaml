name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Release
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Build
        run: swift build -c release --product generate-profile
      - name: Package
        run: |
          mkdir -p output
          tar -czf "output/generate-profile-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            -C .build/release generate-profile
      - name: Generate profiles
        run: |
          for vacc in Definitions/*.vacc; do
            name=$(basename "$vacc" .vacc)
            .build/release/generate-profile -f=vac "$vacc" > "output/${name}.xml"
            .build/release/generate-profile -f=voiceattack "$vacc" > "output/${name}.vap"
          done
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            BEGIN { gsub(/\./, "\\.", v) }
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p && /^\[[^]]+\]:/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version $version"
            exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: output/*
          body_path: release-notes.md
