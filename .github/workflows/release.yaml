name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.3'

      - name: Build
        run: swift build -c release

      - name: Generate Profiles
        run: |
          mkdir -p output
          for vacc in Definitions/*.vacc; do
            name=$(basename "$vacc" .vacc)
            .build/release/generate-profile -f=vac "$vacc" > "output/${name}.xml"
            .build/release/generate-profile -f=voiceattack "$vacc" > "output/${name}.vap"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: output/*
          generate_release_notes: true
